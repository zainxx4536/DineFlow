server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  profiles:
    active: dev

  datasource:
    driver-class-name: ${dineflow.datasource.driver-class-name}
    url: jdbc:mysql://${dineflow.datasource.host}:${dineflow.datasource.port}/${dineflow.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${dineflow.datasource.username}
    password: ${dineflow.datasource.password}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  mvc:
    log-request-details: false
    log-resolved-exception: false

  redis:
    host: ${dineflow.redis.host}
    port: ${dineflow.redis.port}
    password: ${dineflow.redis.password}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 100ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dineflow.entity

  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

  global-config:
    db-config:
      id-type: auto
      update-strategy: not_null

logging:
  level:
    root: INFO
    com.dineflow: INFO
    com.dineflow.mapper: INFO
    org.apache.http.wire: "OFF"
    org.apache.http.headers: "OFF"

dineflow:
  jwt:
    admin-token-name: token
    user-token-name: authentication

  wechat:
    pay:
      enabled: false